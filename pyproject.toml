[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platereader"
version = "1.0.0"
description = "Iranian licence plate detection (YOLO26) and recognition (CNN) with an end-to-end pipeline, a Persian web app and an Android app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.4.0",
    "onnxruntime>=1.17",
    "onnx>=1.15",
    "numpy",
    "pandas",
    "opencv-python",
    "pillow",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "tqdm",
    "arabic-reshaper",
    "python-bidi",
]

[project.optional-dependencies]
app = ["gradio>=6.0"]
data = ["gdown"]
dev = ["pytest", "pyflakes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platereader = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
